
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de CSS</title>

    <style>
        * {
            border: 1px solid #0000;
        }

        div {
            display: inline-block;
            width: 50px;
            height: 50px;
        }

        .coitaner {
            position: relative;
        }

        #a {
            position: fixed;
            left: 0px;
            bottom: 0px;
            background-color: #ff0000;
            z-index: 1;
        }

        #b {position: absolute;
            top: 0px;
            background-color: blue;
        }
    </style>
</head>

<body>
    <span>Aula</span>

    <input type="text" placeholder="entre com seus dados bancários">

    <p>
        &lt;&gt;
        <span>
            Acesse sua conta
            &nbsp;&nbsp;&nbsp;&nbsp;
            <mark>aqui</mark>
        </span>
    </p>

    <div class="coitaner"></div>

    <div id="a">A</div>
    <div id="b">B</div>
</body>
</html>
