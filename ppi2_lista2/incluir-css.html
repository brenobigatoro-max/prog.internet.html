<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formas de incluir CSS no HTML</title>
  <link rel="stylesheet" href="3-estilos.css">
  <style>
    .interno { color: #18713c; }
  </style>
</head>
<body>
  <h1>Três formas de incluir CSS</h1>
  <p class="externo">Este parágrafo recebe CSS de 3-estilos.css.</p>
  <p class="interno">Este parágrafo recebe CSS da tag style.</p>
  <p style="color: #a52a2a;">Este parágrafo recebe CSS inline.</p>
</body>
</html>
