<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quatro caixas na mesma linha</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    .linha { font-size: 0; }
    .caixa {
      display: inline-block;
      vertical-align: top;
      width: 25%;
      height: 100px;
      line-height: 100px;
      text-align: center;
      font: 16px/100px Arial, sans-serif;
    }
    .um { background: #6600ff; }
    .dois { background: #009900; }
    .tres { background: #ff0000; }
    .quatro { background: #ffff00; }
  </style>
</head>
<body>
  <div class="linha">
    <div class="caixa um">1</div>
    <div class="caixa dois">2</div>
    <div class="caixa tres">3</div>
    <div class="caixa quatro">4</div>
  </div>
</body>
</html>
