<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quatro faixas em bloco</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    .caixa {
      display: block;
      width: 100%;
      height: 25vh;
      line-height: 25vh;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    .um { background: #6600ff; }
    .dois { background: #009900; }
    .tres { background: #ff0000; }
    .quatro { background: #ffff00; }
  </style>
</head>
<body>
  <div class="caixa um">1</div>
  <div class="caixa dois">2</div>
  <div class="caixa tres">3</div>
  <div class="caixa quatro">4</div>
</body>
</html>
